schema_version: 1

context:
  name: frugally-deep
  version: "0.15.31"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://github.com/Dobiasd/${{ name }}/archive/refs/tags/v${{ version }}.tar.gz
  sha256: 49bf5e30ad2d33e464433afbc8b6fe8536fc959474004a1ce2ac03d7c54bc8ba

build:
  number: 0

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ compiler('cxx') }}
    - ${{ stdlib('c') }}
    - if: not win
      then: make
    - cmake
  host:
    - functionalplus
    - eigen
    - nlohmann_json

tests:
  - script:
      - if: not win
        then: test -f ${PREFIX}/include/fdeep/tensor_shape.hpp
      - if: not win
        then: test -f ${PREFIX}/lib/cmake/frugally-deep/frugally-deepConfig.cmake
      - if: win
        then: if not exist %PREFIX%\\Library\\include\\fdeep\\tensor_shape.hpp exit 1
      - if: win
        then: if not exist %PREFIX%\\Library\\lib\\cmake\\frugally-deep\\frugally-deepConfig.cmake exit 1

about:
  license: MIT
  license_file: LICENSE
  summary: Header-only library for using Keras (TensorFlow) models in C++.
  homepage: https://github.com/Dobiasd/frugally-deep

extra:
  recipe-maintainers:
    - GiulioRomualdi
    - traversaro
