schema_version: 1

context:
  name: frugally-deep
  version: "0.21.1"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://github.com/Dobiasd/${{ name }}/archive/refs/tags/v${{ version }}.tar.gz
  sha256: 0b3390eb07d0e832e81956a63b942259f9e2c2326d956042f86cb2f91a57152c

build:
  number: 0

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ compiler('cxx') }}
    - ${{ stdlib('c') }}
    - if: not win
      then: make
    - cmake
  host:
    - functionalplus
    - eigen
    - nlohmann_json
  run_exports:
    - ${{ pin_subpackage(name, upper_bound='x.x.x') }}

tests:
  - package_contents:
      include:
        - fdeep/tensor_shape.hpp
      files:
        - ${{ "Library/" if win }}lib/cmake/frugally-deep/frugally-deepConfig.cmake

about:
  license: MIT
  license_file: LICENSE
  summary: Header-only library for using Keras (TensorFlow) models in C++.
  homepage: https://github.com/Dobiasd/frugally-deep

extra:
  recipe-maintainers:
    - GiulioRomualdi
    - traversaro
