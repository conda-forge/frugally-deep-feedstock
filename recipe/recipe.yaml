schema_version: 1

context:
  name: frugally-deep
  version: "0.15.28"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://github.com/Dobiasd/${{ name }}/archive/refs/tags/v${{ version }}-p0.tar.gz
  sha256: cad9d8932e4da90d800ed78f614a8f93e4e106aa27b81c7e3049bb8223db5572

build:
  number: 1

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ compiler('cxx') }}
    - ${{ stdlib('c') }}
    - if: not win
      then: make
    - cmake
  host:
    - functionalplus
    - eigen
    - nlohmann_json
  run_exports:
    - ${{ pin_subpackage(name, upper_bound='x.x.x') }}

tests:
  - script:
      - if: not win
        then: test -f ${PREFIX}/include/fdeep/tensor_shape.hpp
      - if: not win
        then: test -f ${PREFIX}/lib/cmake/frugally-deep/frugally-deepConfig.cmake
      - if: win
        then: if not exist %PREFIX%\\Library\\include\\fdeep\\tensor_shape.hpp exit 1
      - if: win
        then: if not exist %PREFIX%\\Library\\lib\\cmake\\frugally-deep\\frugally-deepConfig.cmake exit 1

about:
  license: MIT
  license_file: LICENSE
  summary: Header-only library for using Keras (TensorFlow) models in C++.
  homepage: https://github.com/Dobiasd/frugally-deep

extra:
  recipe-maintainers:
    - GiulioRomualdi
    - traversaro

